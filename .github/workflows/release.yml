name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="shell-acp-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/shell-acp" "dist/${NAME}/"
          cp ARCHITECTURE.md "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: meloalright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "artifacts/shell-acp-${VERSION}-$1.tar.gz.sha256"; }

          mkdir -p tap/Formula
          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__SHA_MAC_ARM__|$(sha aarch64-apple-darwin)|g" \
            -e "s|__SHA_MAC_X86__|$(sha x86_64-apple-darwin)|g" \
            -e "s|__SHA_LIN_ARM__|$(sha aarch64-unknown-linux-musl)|g" \
            -e "s|__SHA_LIN_X86__|$(sha x86_64-unknown-linux-musl)|g" \
            .github/homebrew/shell-acp.rb > tap/Formula/shell-acp.rb

          echo "----- rendered formula -----"
          cat tap/Formula/shell-acp.rb

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shell-acp.rb
          if git diff --staged --quiet; then
            echo "Formula unchanged, nothing to commit."
          else
            git commit -m "shell-acp ${GITHUB_REF_NAME#v}"
            git push
          fi

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # install.js downloads the matching binary from the GitHub Release at the
      # user's install time, so the release assets must already be published.
      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets -q '.assets | length')
            [ "$n" -ge 4 ] && echo "assets ready ($n)" && break
            echo "waiting for assets ($n)... ($i/30)"; sleep 10
          done

      - name: Set version and publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json');p.version='${VERSION}';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          cat package.json
          npm publish --access public
