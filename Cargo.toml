[package]
name = "shell-acp"
version = "0.0.11"
edition = "2021"
license = "MIT"
description = "A shell exposed as an Agent Client Protocol (ACP) agent"
repository = "https://github.com/meloalright/shell-acp"

[dependencies]
portable-pty = "0.8"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
vt100 = "0.16.2"
