[package]
name = "acp-pty"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.8"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
strip-ansi-escapes = "0.2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
libc = "0.2"
